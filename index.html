<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OUTCAST — A journey you can wear</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/uyxdPOn.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#fff;--fg:#1a1a1a;--mute:#8a8a8a;--line:#ececec;--acc:#a39888;--card:#f6f5f3;
--d:"Cormorant Garamond",Georgia,serif;--b:"Jost",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--b);line-height:1.55;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
a{color:inherit}
h1,h2,h3{font-family:var(--d);font-weight:300;line-height:1.05;letter-spacing:.01em}
/* loader */
#loader{position:fixed;inset:0;background:#fff;color:#1a1a1a;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:transform .9s cubic-bezier(.77,0,.18,1)}
#loader.done{transform:translateY(-100%)}
#loader .w{font-family:var(--d);font-size:clamp(2.2rem,11vw,7rem);display:flex;overflow:hidden;padding:0 .1em}
#loader .w span{display:inline-block;transform:translateY(110%);animation:up .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{to{transform:none}}
#loader .bar{width:min(320px,70vw);height:1px;background:#00000014}
#loader .bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
#loader small{letter-spacing:.3em;font-size:.7rem;color:#9a958b}
/* nav */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;justify-content:space-between;align-items:center;padding:16px clamp(18px,4vw,48px);background:#ffffffd9;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{font-family:var(--d);font-size:1.4rem;text-decoration:none;letter-spacing:.02em}
nav{display:flex;gap:clamp(12px,2.5vw,32px);flex-wrap:wrap;justify-content:flex-end}
nav a{text-decoration:none;font-size:.78rem;text-transform:uppercase;letter-spacing:.14em;padding:4px 0;border-bottom:2px solid transparent}
nav a:hover,nav a.on{border-color:var(--acc)}
main{min-height:80vh}
.page{display:none;padding:0 clamp(18px,4vw,48px)}
.page.on{display:block}
.rv{opacity:0;transform:translateY(28px);transition:opacity .8s,transform .8s}
.rv.in{opacity:1;transform:none}
/* hero */
.hero{min-height:calc(100svh - 70px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:6vh 0}
.eyebrow{font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;color:var(--acc);margin-bottom:22px}
.hero h1{font-size:clamp(2.8rem,13vw,10rem);letter-spacing:.14em;font-weight:300;padding-left:.14em}
.hero h1 em{display:block;font-size:.24em;letter-spacing:.05em;margin-top:.7em;color:var(--mute);font-weight:300}
.hero p{max-width:440px;color:var(--mute);margin:26px auto 36px;font-weight:300}
.btn{display:inline-block;border:1px solid var(--fg);border-radius:999px;color:var(--fg);padding:13px 32px;text-decoration:none;letter-spacing:.14em;font-size:.78rem;transition:all .3s}
.btn:hover{background:var(--fg);color:#fff}
.mq{overflow:hidden;border-block:1px solid var(--line);margin:0 calc(-1*clamp(18px,4vw,48px));padding:14px 0;white-space:nowrap}
.mq div{display:inline-block;animation:mq 22s linear infinite;font-family:var(--d);font-size:1.4rem;text-transform:uppercase}
.mq span{margin:0 22px;color:var(--acc)}
@keyframes mq{to{transform:translateX(-50%)}}
/* collections on home */
.sec{padding:clamp(48px,9vw,110px) 0}
.sec>h2{font-size:clamp(2rem,6vw,4.5rem);margin-bottom:36px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px}
.cc{display:block;text-decoration:none;position:relative}
.ph{background:var(--card);aspect-ratio:4864/3242;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;padding:16px;border-radius:22px}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s}
.cc:hover .ph img,.it:hover .ph img{transform:scale(1.05)}
.ph b{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);position:relative}
.cc .meta{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px;gap:12px}
.cc h3{font-size:clamp(1.7rem,3.6vw,2.6rem)}
.cc .meta span{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);white-space:nowrap}
.man{font-family:var(--d);font-style:italic;font-weight:300;font-size:clamp(1.8rem,5vw,3.6rem);line-height:1.15;max-width:20ch;margin:0 auto;text-align:center}
/* collection page */
.ch{padding:clamp(40px,8vw,100px) 0 40px;border-bottom:1px solid var(--line)}
.ch h1{font-size:clamp(2.6rem,11vw,9rem)}
.ch p{max-width:520px;color:var(--mute);margin-top:22px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,2vw,28px);padding:40px 0 80px}
@media (max-width:700px){.grid{grid-template-columns:1fr}}
.it h3{font-size:1.1rem;margin-top:12px}
.it p{font-size:.85rem;color:var(--mute)}
.sw{display:flex;gap:16px;justify-content:space-between;padding:30px 0 60px;border-top:1px solid var(--line);text-transform:uppercase;font-size:.78rem;letter-spacing:.14em;flex-wrap:wrap}
@keyframes fade{from{opacity:0}to{opacity:1}}
.lg{display:block;width:auto;max-width:100%}
.hd{height:30px}.hl{height:clamp(70px,22vw,200px);margin:0 auto}.ld{height:clamp(60px,16vw,130px);animation:fade 1s both}
.tabs{display:flex;gap:clamp(24px,6vw,70px);margin-top:36px;flex-wrap:wrap}
.tb{background:none;border:0;border-bottom:1px solid transparent;font-family:var(--d);font-weight:300;font-size:clamp(1.4rem,3.4vw,2.1rem);color:var(--mute);cursor:pointer;text-align:left;padding:0 0 8px;transition:color .3s}
.tb small{display:block;font-family:var(--b);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:4px}
.tb.on{color:var(--fg);border-color:var(--fg)}
.cp{display:none}.cp.on{display:block;animation:fade .6s}
.cd{color:var(--mute);max-width:520px;margin-top:36px}
.sl{display:none}.sl.on{display:block;animation:fade .4s}
.ph.k{background:#1c1c1c}.ph.k b{color:#999}
.vt{display:flex;gap:18px;margin-top:10px}
.vt button{background:none;border:0;border-bottom:1px solid transparent;font:inherit;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);cursor:pointer;padding:0 0 2px}
.vt .on{color:var(--fg);border-color:var(--fg)}
.ss .s{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform:translateX(100%)}
.ss .s.on{transform:none;transition:transform .9s cubic-bezier(.65,0,.25,1)}
.ss .s.out{transform:translateX(-100%);transition:transform .9s cubic-bezier(.65,0,.25,1)}
.ss .s.k{background:#1c1c1c}.ss .s.k b{color:#999}
.grid .ph img{cursor:zoom-in}
#zoom{position:fixed;inset:0;z-index:90;background:#fffffff2;display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 56px) 20px 24px;cursor:zoom-out}
#zoom.on{display:flex;animation:fade .3s}
#zoom img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
#zoom button{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:20px;background:none;border:0;font-size:2.2rem;line-height:1;cursor:pointer;color:var(--fg)}
.dots{position:absolute;bottom:14px;left:0;right:0;display:flex;gap:7px;justify-content:center;z-index:2;mix-blend-mode:difference}
.dots i{width:6px;height:6px;border-radius:50%;background:#fff;opacity:.4;transition:opacity .4s}
.dots i.on{opacity:1}
#dots{position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(circle,#d2d2d2 1px,transparent 1.5px);background-size:30px 30px;opacity:.7;animation:drift 5s linear infinite,breathe 4s ease-in-out infinite}
@keyframes drift{to{background-position:30px 30px}}
@keyframes breathe{50%{opacity:.35}}
/* about & contact */
.ab{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(24px,5vw,80px);padding:clamp(40px,8vw,100px) 0}
.ab h1,.ct h1{font-size:clamp(2.6rem,9vw,7rem)}
.ab .tx p{margin-bottom:18px;color:var(--mute);font-size:1.05rem}
.vals,.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:20px}
.box{border-top:1px solid var(--line);padding:22px 0}
.box h3{font-size:1.25rem;margin-bottom:10px}
.box p{color:var(--mute);font-size:.92rem}
.box small{display:block;color:var(--acc);letter-spacing:.16em;text-transform:uppercase;font-size:.7rem;margin-bottom:12px}
.ct{padding:clamp(40px,8vw,100px) 0}
.ct>p{max-width:480px;color:var(--mute);margin:22px 0 44px}
.ln{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:26px 0;border-top:1px solid var(--line);text-decoration:none;font-family:var(--d);font-weight:300;font-size:clamp(1.5rem,5vw,3.2rem);word-break:break-word;transition:padding .3s,color .3s}
.ln:last-of-type{border-bottom:1px solid var(--line)}
.ln:hover{color:var(--acc);padding-left:14px}
.ln small{font-family:var(--b);font-size:.7rem;letter-spacing:.2em;color:var(--mute);flex:none}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:28px clamp(18px,4vw,48px);border-top:1px solid var(--line);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}.mq div,#dots{animation:none!important}}
</style>
</head>
<body>

<div id="loader"><div class="w" id="lw"></div><div class="bar"><i id="lb"></i></div><small id="ls">A JOURNEY YOU CAN WEAR</small></div>

<header>
  <a class="logo" href="#home" id="logo"></a>
  <nav id="nav"></nav>
</header>
<div id="dots"></div>
<main id="main"></main>
<footer id="foot"></footer>
<div id="zoom"><button aria-label="Close">×</button><img alt=""></div>

<script>
/* =========================================================
   EDIT YOUR SITE HERE — all text, names, links and photos
   live in this one block. Nothing else needs to change.

   PHOTOS: put an image into "image" / "cover" as either a
   data URI (data:image/jpeg;base64,...) or paste the file
   and ask Claude to embed it for you. Leave "" for a placeholder.
   ========================================================= */
const SITE = {
  brand: "OUTCAST",
  tagline: "A journey you can wear.",
  logo: "https://i.imgur.com/UPYt92R.png",   // ← transparent PNG logo (data URI). Empty = shows the text OUTCAST

  home: {
    titleLine2: "A journey you can wear",   // smaller line under the logo
    text: "Clothing for the ones who walk their own road. Every piece is a stop on the journey — wear it.",
    button: "Explore collections",
    marquee: ["Outcast", "A journey you can wear", "Two collections", "Walk your own road"],
    sectionTitle: "The Collections",
    manifesto: "Not made to fit in. Made to move forward."
  },

  collections: [
    {
      id: "collections-1",
      tag: "Collection 001",
      name: "The Ceylon Archive Edition",
      description: "Stories of Sri Lanka, worn on your back. Ceylon Archives brings the island's cities, culture and craftsmanship to streetwear.",
      cover: "",
      // each design has a black and a white version
      items: [
        { name: "COLOMBO", note: "Short description", black: "https://i.imgur.com/i32tMw4.jpeg", white: "https://i.imgur.com/3Dtmc2h.jpeg" },
        { name: "KANDY", note: "Short description", black: "https://i.imgur.com/osgLCOe.jpeg", white: "https://i.imgur.com/dGOEH0T.jpeg" },
        { name: "JAFFNA", note: "Short description", black: "https://i.imgur.com/kxvAbjK.jpeg", white: "https://i.imgur.com/J9o6ovm.jpeg" }
      ]
    },
    {
      id: "collections-2",
      tag: "Collection 002",
      name: "The Paradise Frames Edition",
      description: "Sri Lanka, framed and worn. Frames of Paradise turns the island's cities and culture into wearable memories.",
      cover: "",
      items: [
        { name: "ELLA", note: "Short description", black: "https://i.imgur.com/nIleoJc.jpeg", white: "https://i.imgur.com/34a839e.jpeg" },
        { name: "GALLE", note: "Short description", black: "https://i.imgur.com/p6JF68V.jpeg", white: "https://i.imgur.com/NwHxVd9.jpeg" },
        { name: "MIRISSA", note: "Short description", black: "https://i.imgur.com/R00Kz0r.jpeg", white: "https://i.imgur.com/93Jpp20.jpeg" }
      ]
    }
  ],

  about: {
    heading: "About us",
    story: [
      "OUTCAST is a clothing brand from Ceylon, Sri Lanka, focused on quality wearables — made mainly for the younger generation and for tourists travelling all around the country.",
      "Our vision is to provide quality, durable t-shirts at affordable prices, with designs that go with the different cultures and places all across our island, Ceylon."
    ],
    valuesTitle: "What we stand for",
    values: [
      { title: "Quality & durability", text: "T-shirts made to last, season after season." },
      { title: "Affordable", text: "Good quality should not cost the earth." },
      { title: "Ceylon, in every design", text: "Our designs follow the cultures and places of the island." }
    ]
  },

  contact: {
    heading: "Get in touch",
    text: "Questions, collaborations or suggestions? We welcome all of them — reach out, we read everything.",
    email: "teesbyoutcast@gmail.com",
    instagramHandle: "@teesbyoutcast",
    instagramUrl: "https://www.instagram.com/teesbyoutcast"
  }
};

/* ================= engine (no need to edit below) ================= */
const $ = s => document.querySelector(s);
const ph = (img, label, tone) => `<div class="ph ${tone || ""}">${img ? `<img src="${img}" alt="${label}" loading="lazy">` : ""}${img ? "" : `<b>${label} · photo</b>`}</div>`;
const C = SITE.collections;

const brandMark = c => SITE.logo ? `<img class="lg ${c}" src="${SITE.logo}" alt="${SITE.brand}">` : SITE.brand;
$("#logo").innerHTML = brandMark("hd");
$("#nav").innerHTML = [["home","Home"],["collections","Collections"],["about","About"],["contact","Contact"]]
  .map(([h,t]) => `<a href="#${h}" data-p="${h}">${t}</a>`).join("");
$("#foot").innerHTML = `<span>© ${new Date().getFullYear()} ${SITE.brand}</span><span>${SITE.tagline}</span>`;

const pages = {};
const slideshow = c => { const sl = c.items.flatMap(it => [[it.black, it.name, "Black", "k"], [it.white, it.name, "White", "w"]]); return `<div class="ph ss">${sl.map(([im, n, v, t]) => `<div class="s ${t}">${im ? `<img src="${im}" alt="${n} ${v}" loading="lazy">` : `<b>${n} · ${v}</b>`}</div>`).join("")}<div class="dots">${sl.map(() => "<i></i>").join("")}</div></div>`; };
const H = SITE.home;
const mq = H.marquee.map(t => `${t}<span>✦</span>`).join("");
pages.home = `
<section class="hero">
  <h1 class="rv">${brandMark("hl")}<em>${H.titleLine2}</em></h1>
  <p class="rv">${H.text}</p>
  <a class="btn rv" href="#collections-home" onclick="document.getElementById('collections-home').scrollIntoView();return false">${H.button}</a>
</section>
<section class="sec" id="collections-home">
  <h2 class="rv">${H.sectionTitle}</h2>
  <div class="cols">${C.map(c => `
    <a class="cc rv" href="#${c.id}">${slideshow(c)}
      <div class="meta"><h3>${c.name}</h3><span>${c.tag} →</span></div></a>`).join("")}
  </div>
</section>
<section class="sec"><p class="man rv">${H.manifesto}</p></section>`;

let curCol = 0;
const pickCol = i => { curCol = i; document.querySelectorAll(".cp").forEach((p, k) => p.classList.toggle("on", k === i)); document.querySelectorAll(".tb").forEach((b, k) => b.classList.toggle("on", k === i)); };
const pickV = (b, v) => { const a = b.closest(".it"); a.querySelectorAll(".sl").forEach(s => s.classList.toggle("on", s.dataset.v === v)); a.querySelectorAll(".vt button").forEach(x => x.classList.toggle("on", x === b)); };
pages.collections = `
<section class="ch"><h1 class="rv">Collections</h1>
  <div class="tabs rv">${C.map((c, i) => `<button class="tb" onclick="pickCol(${i})"><small>${c.tag}</small>${c.name}</button>`).join("")}</div></section>
${C.map(c => `<div class="cp"><p class="cd">${c.description}</p>
  <section class="grid">${c.items.map(it => `<article class="it">
    <div class="sl on" data-v="black">${ph(it.black, it.name + " · Black", "k")}</div>
    <div class="sl" data-v="white">${ph(it.white, it.name + " · White", "w")}</div>
    <h3>${it.name}</h3><p>${it.note}</p>
    <div class="vt"><button class="on" onclick="pickV(this,'black')">Black</button><button onclick="pickV(this,'white')">White</button></div>
  </article>`).join("")}</section></div>`).join("")}`;

const A = SITE.about;
pages.about = `
<section class="ab"><h1 class="rv">${A.heading}</h1><div class="tx rv">${A.story.map(p => `<p>${p}</p>`).join("")}</div></section>
<section class="sec" style="padding-top:0"><h2 class="rv">${A.valuesTitle}</h2>
  <div class="vals">${A.values.map((v,i) => `<div class="box rv"><small>0${i+1}</small><h3>${v.title}</h3><p>${v.text}</p></div>`).join("")}</div></section>`;

const K = SITE.contact;
pages.contact = `
<section class="ct"><h1 class="rv">${K.heading}</h1><p class="rv">${K.text}</p>
  <a class="ln rv" href="mailto:${K.email}"><span>${K.email}</span><small>EMAIL ↗</small></a>
  <a class="ln rv" href="${K.instagramUrl}" target="_blank" rel="noopener"><span>${K.instagramHandle}</span><small>INSTAGRAM ↗</small></a>
</section>`;

$("#main").innerHTML = Object.keys(pages).map(k => `<div class="page" id="pg-${k}">${pages[k]}</div>`).join("");

const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .12 });
function route() {
  let h = (location.hash || "#home").slice(1), sel = null;
  const m = h.match(/^collections-([12])$/);
  if (m) { sel = +m[1] - 1; h = "collections"; }
  if (!pages[h]) h = "home";
  pickCol(sel === null ? curCol : sel);
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("on", p.id === "pg-" + h));
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.p === h));
  window.scrollTo(0, 0);
  document.querySelectorAll("#pg-" + h + " .rv").forEach((el, i) => { el.classList.remove("in"); el.style.transitionDelay = Math.min(i, 5) * 80 + "ms"; io.observe(el); });
}
addEventListener("hashchange", route);
route();

/* click-to-zoom in collections */
const zm = $("#zoom");
$("#main").addEventListener("click", e => { if (e.target.matches(".grid .ph img")) { zm.querySelector("img").src = e.target.src; zm.classList.add("on"); } });
zm.addEventListener("click", () => zm.classList.remove("on"));
addEventListener("keydown", e => { if (e.key === "Escape") zm.classList.remove("on"); });

/* home collection slideshows */
document.querySelectorAll(".ss").forEach((el, k) => {
  let i = 0; const s = el.querySelectorAll(".s"), d = el.querySelectorAll(".dots i");
  const go = n => { const p = s[i]; if (p !== s[n]) { p.classList.remove("on"); p.classList.add("out"); setTimeout(() => p.classList.remove("out"), 950); } i = n; s[i].classList.remove("out"); s[i].classList.add("on"); d.forEach((x, j) => x.classList.toggle("on", j === i)); };
  go(0); setInterval(() => go((i + 1) % s.length), 3500);
});

/* loading animation */
const lw = $("#lw");
if (SITE.logo) { lw.className = ""; lw.innerHTML = brandMark("ld"); } else SITE.brand.split("").forEach((ch, i) => { const s = document.createElement("span"); s.textContent = ch; s.style.animationDelay = i * 90 + "ms"; lw.appendChild(s); });
let n = 0;
const t = setInterval(() => {
  n = Math.min(100, n + Math.ceil(Math.random() * 9));
  $("#lb").style.width = n + "%";
  if (n >= 100) { clearInterval(t); $("#ls").textContent = SITE.tagline.toUpperCase(); setTimeout(() => { $("#loader").classList.add("done"); route(); }, 500); }
}, 80);
</script>
</body>
</html>
